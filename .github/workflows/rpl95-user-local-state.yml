name: RPL-95 user-local state

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/rpl95-user-local-state.yml"
      - "Makefile"
      - "docs/harness/repo-audit-baseline.md"
      - "docs/harness/user-local-state.md"
      - "scripts/lib/user-local-state.mjs"
      - "scripts/lib/work-start-execution-state.mjs"
      - "scripts/lib/hook-failure-state.mjs"
      - "scripts/oh-my-ai.mjs"
      - "scripts/prompt-routing-hook.mjs"
      - "scripts/test-install-fixtures.sh"
      - "scripts/test-user-local-state-fixtures.mjs"
      - "scripts/test-work-start-fixtures.sh"
      - "skills/harness-automation/SKILL.md"

permissions:
  contents: read

jobs:
  user-local-state:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OH_MY_AI_STATE_ROOT: ${{ runner.temp }}/oh-my-ai-user-local-state
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check JavaScript and shell syntax
        run: |
          node --check scripts/lib/user-local-state.mjs
          node --check scripts/lib/work-start-execution-state.mjs
          node --check scripts/lib/hook-failure-state.mjs
          node --check scripts/prompt-routing-hook.mjs
          node --check scripts/oh-my-ai.mjs
          node --check scripts/test-user-local-state-fixtures.mjs
          bash -n scripts/test-install-fixtures.sh scripts/test-work-start-fixtures.sh
      - name: Test user-local storage primitives and Work-start compatibility
        run: make test-user-local-state-fixtures
      - name: Test Work-start routing and suggestion regressions
        run: ./scripts/test-work-start-fixtures.sh
      - name: Test prompt routing regressions
        run: ./scripts/test-routing-fixtures.sh
      - name: Test install and execution boundary regressions
        run: ./scripts/test-install-fixtures.sh
