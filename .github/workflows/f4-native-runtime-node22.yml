name: F4 Native Runtime Integration Node 22

on:
  push:
    paths:
      - ".github/workflows/f4-native-runtime-node22.yml"
      - "docs/contracts/f4-execution-capability.md"
      - "docs/contracts/f4-native-host-binding-owner-resolver.md"
      - "scripts/lib/f4-native-runtime-composition.mjs"
      - "scripts/lib/f4-physical-state-binding.mjs"
      - "scripts/lib/pending-handoff-manual-resume-attempt-outcome-user-local-provider.mjs"
      - "scripts/lib/f4-scope-preservation-checkpoint.mjs"
      - "scripts/lib/f4-scope-preservation-checkpoint-user-local-store.mjs"
      - "scripts/test-pending-handoff-manual-resume-runtime-composition-fixtures.mjs"
      - "scripts/test-f4-rpl95-attempt-store-integration.mjs"
      - "scripts/test-f4-scope-preservation-checkpoint-fixtures.mjs"
      - "scripts/test-f4-scope-preservation-checkpoint-user-local-store-fixtures.mjs"
      - "scripts/test-pending-handoff-store-fixtures.mjs"
      - "scripts/test-pending-handoff-claim-lease-fixtures.mjs"
      - "scripts/test-pending-handoff-manual-resume-attempt-outcome-fixtures.mjs"
      - "scripts/test-pending-handoff-manual-resume-attempt-outcome-store-adapter-fixtures.mjs"
      - "scripts/test-pending-handoff-delivery-consumption-fixtures.mjs"
  pull_request:
    branches:
      - master
      - feat/rpl-120-durable-claim-integration-20261030
      - feat/rpl-118-capability-preflight-mvp-20261102
    paths:
      - ".github/workflows/f4-native-runtime-node22.yml"
      - "docs/contracts/f4-execution-capability.md"
      - "docs/contracts/f4-native-host-binding-owner-resolver.md"
      - "scripts/lib/f4-native-runtime-composition.mjs"
      - "scripts/lib/f4-physical-state-binding.mjs"
      - "scripts/lib/pending-handoff-manual-resume-attempt-outcome-user-local-provider.mjs"
      - "scripts/lib/f4-scope-preservation-checkpoint.mjs"
      - "scripts/lib/f4-scope-preservation-checkpoint-user-local-store.mjs"
      - "scripts/test-pending-handoff-manual-resume-runtime-composition-fixtures.mjs"
      - "scripts/test-f4-rpl95-attempt-store-integration.mjs"
      - "scripts/test-f4-scope-preservation-checkpoint-fixtures.mjs"
      - "scripts/test-f4-scope-preservation-checkpoint-user-local-store-fixtures.mjs"
      - "scripts/test-pending-handoff-store-fixtures.mjs"
      - "scripts/test-pending-handoff-claim-lease-fixtures.mjs"
      - "scripts/test-pending-handoff-manual-resume-attempt-outcome-fixtures.mjs"
      - "scripts/test-pending-handoff-manual-resume-attempt-outcome-store-adapter-fixtures.mjs"
      - "scripts/test-pending-handoff-delivery-consumption-fixtures.mjs"

permissions:
  contents: read

jobs:
  f4-native-node22:
    name: F4 native fixtures on Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Check out pinned RPL-95 physical storage source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ranikun-labs/oh-my-ai
          ref: be1bd8fca212aecbea6f16be2157d20916df0d3a
          path: rpl95-source
          sparse-checkout: scripts/lib/user-local-state.mjs
          sparse-checkout-cone-mode: false
      - name: Verify source syntax
        run: |
          node --check scripts/lib/f4-native-runtime-composition.mjs
          node --check scripts/lib/f4-physical-state-binding.mjs
          node --check scripts/lib/pending-handoff-manual-resume-attempt-outcome-user-local-provider.mjs
          node --check scripts/lib/f4-scope-preservation-checkpoint.mjs
          node --check scripts/lib/f4-scope-preservation-checkpoint-user-local-store.mjs
          node --check scripts/lib/pending-handoff-manual-resume-runtime-composition.mjs
          node --check scripts/lib/pending-handoff-manual-resume-attempt-outcome.mjs
          node --check scripts/lib/pending-handoff-manual-resume-attempt-outcome-store-adapter.mjs
          node --check scripts/test-pending-handoff-manual-resume-runtime-composition-fixtures.mjs
          node --check scripts/test-f4-rpl95-attempt-store-integration.mjs
          node --check scripts/test-f4-scope-preservation-checkpoint-fixtures.mjs
          node --check scripts/test-f4-scope-preservation-checkpoint-user-local-store-fixtures.mjs
      - name: Run F4 and storage regression fixtures
        run: |
          node scripts/test-pending-handoff-store-fixtures.mjs
          node scripts/test-pending-handoff-claim-lease-fixtures.mjs
          node scripts/test-pending-handoff-manual-resume-runtime-composition-fixtures.mjs
          node scripts/test-pending-handoff-manual-resume-attempt-outcome-fixtures.mjs
          node scripts/test-pending-handoff-manual-resume-attempt-outcome-store-adapter-fixtures.mjs
          node scripts/test-pending-handoff-delivery-consumption-fixtures.mjs
          node scripts/test-f4-scope-preservation-checkpoint-fixtures.mjs
          node scripts/test-f4-scope-preservation-checkpoint-user-local-store-fixtures.mjs
      - name: Verify Attempt adapter against exact RPL-95 source
        env:
          F4_RPL95_USER_LOCAL_STATE_MODULE: ${{ github.workspace }}/rpl95-source/scripts/lib/user-local-state.mjs
        run: node scripts/test-f4-rpl95-attempt-store-integration.mjs
