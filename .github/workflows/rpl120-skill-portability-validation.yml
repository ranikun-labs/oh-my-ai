name: RPL-120 Portable Skill Validation

on:
  push:
    branches:
      - codex/rpl120-skill-portability-ci-20261106
    paths:
      - ".github/workflows/rpl120-skill-portability-validation.yml"
      - "skills/adaptive-goal-closure/**"
      - "scripts/render-instructions.sh"
      - "scripts/render-skill-index.mjs"
      - "scripts/test-routing-fixtures.sh"
      - "scripts/work-start-skill-match.mjs"
      - "scripts/prompt-routing-hook.mjs"
      - "instructions/**"
      - "Makefile"

permissions:
  contents: read

jobs:
  skill-portability:
    name: Metadata, portability, routing, and generated files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the pushed source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Check exact source delta
        env:
          BASE_SHA: 201e919cdd981e04289cd06766c6ff712209e11d
        run: git diff --check "$BASE_SHA...$GITHUB_SHA"

      - name: Validate explicit-only Skill metadata and portable layout
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import os from "node:os";
          import path from "node:path";

          const skillPath = "skills/adaptive-goal-closure/SKILL.md";
          const skillDir = path.dirname(skillPath);
          const descriptorPath = path.join(skillDir, "agents", "openai.yaml");
          const skill = fs.readFileSync(skillPath, "utf8");
          const descriptor = fs.readFileSync(descriptorPath, "utf8");
          const skillLines = skill.split("\n");
          assert.equal(skillLines[0], "---");
          const frontmatterEnd = skillLines.indexOf("---", 1);
          assert.ok(frontmatterEnd > 1, "SKILL.md frontmatter must close");
          const metadataLines = skillLines.slice(1, frontmatterEnd);

          assert.ok(metadataLines.includes("name: adaptive-goal-closure"));
          assert.ok(metadataLines.some(line => line.startsWith("description: ") && line.length > "description: ".length));
          assert.ok(metadataLines.includes("disable-model-invocation: true"));
          assert.ok(metadataLines.includes("  source: born-here"));
          assert.ok(metadataLines.some(line => line.startsWith("  summary: ") && line.length > "  summary: ".length));
          assert.equal(metadataLines.some(line => line.startsWith("  route:")), false,
            "explicit-only Skill must not gain automatic routing");

          const descriptorLines = descriptor.split("\n");
          assert.ok(descriptorLines.includes("interface:"));
          assert.ok(descriptorLines.includes('  display_name: "Adaptive Goal Closure"'));
          assert.ok(descriptorLines.includes('  short_description: "Continue an approved objective with bounded F4 execution"'));
          const promptLine = descriptorLines.find(line => line.startsWith("  default_prompt:"));
          assert.ok(promptLine && promptLine.includes("SKILL.md"));
          assert.equal(promptLine.includes("/workspace/"), false, "descriptor must not pin a local checkout path");
          assert.equal(promptLine.includes("/home/"), false, "descriptor must not pin a user home path");
          assert.ok(descriptorLines.includes("  allow_implicit_invocation: false"));

          const index = JSON.parse(fs.readFileSync("skills/skill-index.json", "utf8"));
          assert.equal(index.skills.some(skillEntry => skillEntry.name === "adaptive-goal-closure"), false,
            "explicit-only Skill must remain outside the auto-routing index");

          const temp = fs.mkdtempSync(path.join(os.tmpdir(), "rpl120-portable-skill-"));
          try {
            const target = path.join(temp, "another-project", "skills", "adaptive-goal-closure");
            fs.mkdirSync(path.dirname(target), { recursive: true });
            fs.cpSync(skillDir, target, { recursive: true });
            assert.equal(fs.readFileSync(path.join(target, "SKILL.md"), "utf8"), skill);
            assert.equal(fs.readFileSync(path.join(target, "agents", "openai.yaml"), "utf8"), descriptor);
          } finally {
            fs.rmSync(temp, { recursive: true, force: true });
          }
          NODE

      - name: Regenerate Skill index and instructions
        run: |
          make instructions
          git diff --exit-code -- AGENTS.md CLAUDE.md claude/CLAUDE.md MINE.md skills/skill-index.json

      - name: Verify routing consumers and false-positive guards
        run: make test-routing-fixtures
