name: RPL-120 Portable Skill Validation

on:
  push:
    branches:
      - codex/rpl120-skill-portability-ci-20261106
    paths:
      - ".github/workflows/rpl120-skill-portability-validation.yml"
      - "skills/adaptive-goal-closure/**"
      - ".agents/skills/**"
      - "scripts/render-instructions.sh"
      - "scripts/render-skill-index.mjs"
      - "scripts/test-routing-fixtures.sh"
      - "scripts/work-start-skill-match.mjs"
      - "scripts/prompt-routing-hook.mjs"
      - "instructions/**"
      - "Makefile"

permissions:
  contents: read

jobs:
  skill-portability:
    name: Metadata, portability, routing, and generated files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the pushed source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Check exact source delta
        env:
          BASE_SHA: 201e919cdd981e04289cd06766c6ff712209e11d
        run: git diff --check "$BASE_SHA...$GITHUB_SHA"

      - name: Validate explicit-only Skill metadata and portable layout
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import os from "node:os";
          import path from "node:path";

          const skillPath = "skills/adaptive-goal-closure/SKILL.md";
          const skillDir = path.dirname(skillPath);
          const descriptorPath = path.join(skillDir, "agents", "openai.yaml");
          const skill = fs.readFileSync(skillPath, "utf8");
          const descriptor = fs.readFileSync(descriptorPath, "utf8");
          const skillLines = skill.split("\n");
          assert.equal(skillLines[0], "---");
          const frontmatterEnd = skillLines.indexOf("---", 1);
          assert.ok(frontmatterEnd > 1, "SKILL.md frontmatter must close");
          const metadataLines = skillLines.slice(1, frontmatterEnd);

          assert.ok(metadataLines.includes("name: adaptive-goal-closure"));
          assert.ok(metadataLines.some(line => line.startsWith("description: ") && line.length > "description: ".length));
          assert.ok(metadataLines.includes("disable-model-invocation: true"));
          assert.ok(metadataLines.includes("  source: born-here"));
          assert.ok(metadataLines.some(line => line.startsWith("  summary: ") && line.length > "  summary: ".length));
          assert.equal(metadataLines.some(line => line.startsWith("  route:")), false,
            "explicit-only Skill must not gain automatic routing");

          const descriptorLines = descriptor.split("\n");
          assert.ok(descriptorLines.includes("interface:"));
          assert.ok(descriptorLines.includes('  display_name: "Adaptive Goal Closure"'));
          assert.ok(descriptorLines.includes('  short_description: "Continue an approved objective with bounded F4 execution"'));
          const promptLine = descriptorLines.find(line => line.startsWith("  default_prompt:"));
          assert.ok(promptLine && promptLine.includes("$adaptive-goal-closure"),
            "the descriptor must name the explicitly invoked Skill");
          assert.ok(promptLine.includes("invoked SKILL.md procedure"),
            "the descriptor must apply the invoked Skill instructions");
          assert.equal(promptLine.includes("skills/adaptive-goal-closure/SKILL.md"), false,
            "descriptor must not assume the Skill is inside the current repository");
          assert.equal(promptLine.includes("/workspace/"), false, "descriptor must not pin a local checkout path");
          assert.equal(promptLine.includes("/home/"), false, "descriptor must not pin a user home path");
          assert.equal(skill.includes("skills/adaptive-goal-closure/SKILL.md"), false,
            "Skill examples must not assume a repository-root-relative location");
          assert.ok(descriptorLines.includes("  allow_implicit_invocation: false"));

          const index = JSON.parse(fs.readFileSync("skills/skill-index.json", "utf8"));
          assert.equal(index.skills.some(skillEntry => skillEntry.name === "adaptive-goal-closure"), false,
            "explicit-only Skill must remain outside the auto-routing index");

          const temp = fs.mkdtempSync(path.join(os.tmpdir(), "rpl120-portable-skill-"));
          const priorCwd = process.cwd();
          try {
            const targetRepo = path.join(temp, "unrelated-project");
            const copiedSkillDir = path.join(targetRepo, "vendor", "skills", "adaptive-goal-closure");
            const discoveryLink = path.join(targetRepo, ".agents", "skills", "adaptive-goal-closure");
            fs.mkdirSync(path.dirname(copiedSkillDir), { recursive: true });
            fs.mkdirSync(path.dirname(discoveryLink), { recursive: true });
            fs.cpSync(skillDir, copiedSkillDir, { recursive: true });

            const relativeTarget = path.relative(path.dirname(discoveryLink), copiedSkillDir);
            assert.equal(path.isAbsolute(relativeTarget), false, "portable discovery link must be relative");
            fs.symlinkSync(relativeTarget, discoveryLink, "dir");
            assert.equal(fs.lstatSync(discoveryLink).isSymbolicLink(), true);
            assert.equal(fs.readlinkSync(discoveryLink), relativeTarget);
            assert.equal(fs.realpathSync(discoveryLink), fs.realpathSync(copiedSkillDir));

            process.chdir(targetRepo);
            const discoveredSkillPath = path.join(process.cwd(), ".agents", "skills", "adaptive-goal-closure", "SKILL.md");
            const discoveredDescriptorPath = path.join(process.cwd(), ".agents", "skills", "adaptive-goal-closure", "agents", "openai.yaml");
            assert.equal(fs.readFileSync(discoveredSkillPath, "utf8"), skill);
            assert.equal(fs.readFileSync(discoveredDescriptorPath, "utf8"), descriptor);
          } finally {
            process.chdir(priorCwd);
            fs.rmSync(temp, { recursive: true, force: true });
          }
          NODE

      - name: Regenerate Skill index and instructions
        run: |
          make instructions
          git diff --exit-code -- AGENTS.md CLAUDE.md claude/CLAUDE.md MINE.md skills/skill-index.json

      - name: Verify routing consumers and false-positive guards
        run: make test-routing-fixtures

      - name: Keep F4 Skill out of automatic routing
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import path from "node:path";
          import { spawnSync } from "node:child_process";

          const indexPath = path.resolve("skills/skill-index.json");
          const inputs = [
            "What does F4 mean?",
            "What did the F4 task do?",
            "What is $adaptive-goal-closure?",
          ];
          const consumers = [
            ["work-start", "scripts/work-start-skill-match.mjs", "--format=json"],
            ["prompt-hook", "scripts/prompt-routing-hook.mjs", "--format=routing-json"],
          ];

          for (const prompt of inputs) {
            for (const [name, script, format] of consumers) {
              const result = spawnSync(process.execPath, [script, format], {
                input: prompt,
                encoding: "utf8",
                env: { ...process.env, OH_MY_AI_SKILL_INDEX: indexPath },
              });
              assert.equal(result.status, 0, `${name} exited for ${JSON.stringify(prompt)}: ${result.stderr}`);
              const routing = JSON.parse(result.stdout);
              assert.equal(routing.routing_status, "no_match",
                `${name} auto-routed ${JSON.stringify(prompt)}`);
              assert.deepEqual(routing.skill_candidates, [],
                `${name} returned candidates for ${JSON.stringify(prompt)}`);
              console.log(`passed: ${name} does not auto-route ${JSON.stringify(prompt)}`);
            }
          }
          NODE
