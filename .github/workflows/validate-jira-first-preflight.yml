name: Jira-first advisory routing regression

on:
  pull_request:
    paths:
      - '.github/workflows/validate-jira-first-preflight.yml'
      - 'scripts/prompt-routing-hook.mjs'
      - 'scripts/lib/jira-first-development-intent.mjs'
      - 'scripts/test-jira-first-development-intent.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: node --check scripts/lib/jira-first-development-intent.mjs && node --check scripts/prompt-routing-hook.mjs && node --check scripts/test-jira-first-development-intent.mjs
      - name: Run Jira-first intent cases
        run: node scripts/test-jira-first-development-intent.mjs
      - name: Run existing routing fixtures
        run: make test-routing-fixtures
