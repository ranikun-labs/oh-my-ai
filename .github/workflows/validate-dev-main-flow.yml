name: Validate dev-main-flow source

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the pinned YAML parser for Skill metadata
        run: npm ci --prefix .github/ci/yaml --ignore-scripts --no-audit --no-fund

      - name: Run Skill frontmatter YAML fixtures
        run: node scripts/test-skill-frontmatter-validation.cjs

      - name: Validate Jira closure draft source contract
        run: node scripts/test-dev-main-flow-jira-closure-contract.mjs

      - name: Validate batch-report composition source contract
        run: node scripts/test-batch-report-composition-contract.mjs

      - name: Validate explicit-only Skill metadata and source link
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const { execFileSync } = require('node:child_process');

          const root = process.cwd();
          // Source 위치는 depth를 가정하지 않고 discovery CLI로 찾는다(skills/<id> 또는 skills/{core,library}/<id>).
          const skillDir = execFileSync(process.execPath, [
            path.join(root, 'scripts', 'lib', 'skill-discovery.mjs'), '--resolve', 'dev-main-flow', '--root', root,
          ], { encoding: 'utf8' }).trim();
          const skillPath = path.join(skillDir, 'SKILL.md');
          const skill = fs.readFileSync(skillPath, 'utf8');
          const match = skill.match(/^---\r?\n([\s\S]*?)\r?\n---(?:\r?\n|$)/);
          assert.ok(match, 'SKILL.md must have frontmatter');
          const { validateExplicitOnlyFrontmatter, validateExplicitOnlyAgentMetadata } = require(path.join(root, 'scripts', 'lib', 'skill-frontmatter-validation.cjs'));
          validateExplicitOnlyFrontmatter(match[1]);
          const agentMetadata = fs.readFileSync(path.join(skillDir, 'agents', 'openai.yaml'), 'utf8');
          validateExplicitOnlyAgentMetadata(agentMetadata);

          const linkPath = path.join(root, '.agents', 'skills', 'dev-main-flow');
          assert.ok(fs.lstatSync(linkPath).isSymbolicLink(), 'Repository Skill link must be a symlink');
          // 링크 문자열(상대 경로 여부·위치)은 아래 exposure 검사가 realpath 기준으로 판정한다. 여기서는 실체만 확인한다.
          assert.equal(fs.realpathSync(linkPath), fs.realpathSync(skillDir), 'Repository Skill link must resolve to the discovered source directory');
          for (const name of ['SKILL.md', 'agents/openai.yaml']) {
            assert.equal(
              fs.realpathSync(path.join(linkPath, name)),
              fs.realpathSync(path.join(skillDir, name)),
              `${name} through the link must resolve to the source file`,
            );
          }
          console.log('Explicit-only metadata and relative source link are valid. This check does not establish Native discovery or Apply.');
          NODE

      - name: Validate .claude/skills and .agents/skills exposure links
        run: node scripts/check-skill-exposure-links.mjs

      - name: Regenerate instructions and check generated diffs
        run: |
          make instructions
          git diff --exit-code -- MINE.md
          git diff --exit-code -- AGENTS.md CLAUDE.md claude/CLAUDE.md skills/skill-index.json

      - name: Run the existing routing fixtures
        run: make test-routing-fixtures

      - name: Run existing report, result and preflight regressions
        run: |
          node scripts/test-f1-report-advisory.mjs
          node scripts/f1-report-advisory.mjs docs/examples/f1-report-rpl119.md
          make test-result-fixtures
          make test-truthfulness-fixtures
          make test-git-work-preflight-fixtures

      - name: Run Codex app-server usage observer fixtures
        run: node scripts/test-pending-handoff-codex-runtime-adapter-fixtures.mjs
        timeout-minutes: 2

      - name: Run dev-main-flow install fixtures
        run: make test-dev-main-flow-install-fixtures
        timeout-minutes: 2

      - name: Run work-state observation view fixtures
        run: |
          node scripts/test-work-state-observation-view-fixtures.mjs
          node scripts/test-work-tree-view.mjs
          node scripts/test-jira-observations.mjs
          bash scripts/test-jira-observations-cli.sh
          bash scripts/test-work-view-stdin-limits.sh
          bash scripts/test-work-tree-cli.sh
        timeout-minutes: 2

      - name: Run offline usage summary fixtures
        run: |
          node scripts/test-role-usage-summary.mjs
          node scripts/test-usage-f1.mjs
        timeout-minutes: 2

      - name: Check whitespace in the pull request diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"
