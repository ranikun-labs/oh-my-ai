name: Validate dev-main-flow source

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate explicit-only Skill metadata and source link
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');

          const root = process.cwd();
          const skillDir = path.join(root, 'skills', 'dev-main-flow');
          const skillPath = path.join(skillDir, 'SKILL.md');
          const skill = fs.readFileSync(skillPath, 'utf8');
          const match = skill.match(/^---\r?\n([\s\S]*?)\r?\n---(?:\r?\n|$)/);
          assert.ok(match, 'SKILL.md must have frontmatter');
          const lines = match[1].split(/\r?\n/);
          const topValue = (key) => {
            const line = lines.find((item) => !/^\s/.test(item) && item.startsWith(`${key}:`));
            return line?.slice(key.length + 1).trim();
          };
          assert.equal(topValue('name'), 'dev-main-flow');
          assert.equal(topValue('disable-model-invocation'), 'true');

          const metadataStart = lines.indexOf('metadata:');
          assert.notEqual(metadataStart, -1, 'metadata block is required');
          const metadata = [];
          for (const line of lines.slice(metadataStart + 1)) {
            if (line && !/^\s/.test(line)) break;
            metadata.push(line);
          }
          assert.ok(metadata.some((line) => /^\s+source:\s*born-here\s*$/.test(line)), 'source must be born-here');
          assert.ok(metadata.some((line) => /^\s+summary:\s*\S/.test(line)), 'summary is required');
          assert.ok(!metadata.some((line) => /^\s+(?:route|routing):/.test(line)), 'this planning entry must not add routing');

          const agentMetadata = fs.readFileSync(path.join(skillDir, 'agents', 'openai.yaml'), 'utf8');
          assert.match(agentMetadata, /^\s+allow_implicit_invocation:\s*false\s*$/m);
          assert.match(agentMetadata, /default_prompt:.*Use \$dev-main-flow/);

          const linkPath = path.join(root, '.agents', 'skills', 'dev-main-flow');
          assert.ok(fs.lstatSync(linkPath).isSymbolicLink(), 'Repository Skill link must be a symlink');
          const linkTarget = fs.readlinkSync(linkPath);
          assert.equal(linkTarget, '../../skills/dev-main-flow', 'Repository Skill link must stay relative');
          const linkedDir = path.resolve(path.dirname(linkPath), linkTarget);
          assert.equal(fs.realpathSync(linkedDir), fs.realpathSync(skillDir), 'Repository Skill link must resolve to the source directory');
          for (const name of ['SKILL.md', 'agents/openai.yaml']) {
            assert.equal(
              fs.realpathSync(path.join(linkPath, name)),
              fs.realpathSync(path.join(skillDir, name)),
              `${name} through the link must resolve to the source file`,
            );
          }
          console.log('Explicit-only metadata and relative source link are valid. This check does not establish Native discovery or Apply.');
          NODE

      - name: Validate .claude/skills links (dynamic enumeration)
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const root = process.cwd();
          const claudeSkillsDir = path.join(root, '.claude', 'skills');
          const sourceSkillsDir = path.join(root, 'skills');

          // 링크 구조 검사 실패는 LinkError로 던지고, 최상위에서 원인 메시지만 출력한다.
          class LinkError extends Error {}
          const fail = (name, reason) => new LinkError(`[.claude/skills/${name}] ${reason}`);

          // 대상이 없으면(댕글링) null을 돌려주고, 그 밖의 예외는 그대로 올린다.
          const statOrNull = (target) => {
            try {
              return fs.statSync(target);
            } catch (error) {
              if (error.code === 'ENOENT') return null;
              throw error;
            }
          };

          const frontmatterLines = (file) => {
            const match = fs.readFileSync(file, 'utf8').match(/^---\r?\n([\s\S]*?)\r?\n---(?:\r?\n|$)/);
            return match ? match[1].split(/\r?\n/) : null;
          };
          const topValue = (lines, key) => {
            const line = lines.find((item) => !/^\s/.test(item) && item.startsWith(`${key}:`));
            return line ? line.slice(key.length + 1).trim() : '';
          };

          const checkLink = (name) => {
            const linkPath = path.join(claudeSkillsDir, name);
            let info;
            try {
              info = fs.lstatSync(linkPath);
            } catch (error) {
              throw fail(name, `lstat 실패(${error.code ?? error.message})`);
            }

            // (a) 심볼릭 링크여야 한다. 일반 파일·실제 디렉터리 복사는 실패.
            if (!info.isSymbolicLink()) {
              if (info.isDirectory()) {
                throw fail(name, '실제 디렉터리 복사본입니다. 심볼릭 링크여야 합니다.');
              }
              throw fail(name, '일반 파일입니다(심볼릭 링크 아님). core.symlinks=false 체크아웃이거나 링크가 깨진 상태입니다.');
            }

            // (b) 정확히 상대 경로 ../../skills/<name> 이어야 한다.
            const target = fs.readlinkSync(linkPath);
            const expected = `../../skills/${name}`;
            if (path.isAbsolute(target)) {
              throw fail(name, `절대 경로 링크입니다(${target}). 상대 경로 ${expected} 이어야 합니다.`);
            }
            if (target !== expected) {
              throw fail(name, `대상이 다른 Skill을 가리킵니다(${target}). 기대값: ${expected}`);
            }

            // (c) 대상 skills/<name>이 존재하는 디렉터리여야 한다. 댕글링은 실패.
            const sourceDir = path.join(sourceSkillsDir, name);
            const sourceDirStat = statOrNull(sourceDir);
            if (!sourceDirStat || !sourceDirStat.isDirectory()) {
              throw fail(name, `댕글링 링크입니다. 대상 skills/${name} 디렉터리가 없습니다.`);
            }

            // (d) 링크를 통과한 SKILL.md가 원본과 같은 실체(realpath)여야 한다.
            const linkedSkill = path.join(linkPath, 'SKILL.md');
            const linkedStat = statOrNull(linkedSkill);
            if (!linkedStat || !linkedStat.isFile()) {
              throw fail(name, '링크 경로에서 SKILL.md를 읽을 수 없습니다.');
            }
            const sourceSkill = path.join(sourceDir, 'SKILL.md');
            if (fs.realpathSync(linkedSkill) !== fs.realpathSync(sourceSkill)) {
              throw fail(name, `SKILL.md realpath가 원본 skills/${name}/SKILL.md와 다릅니다.`);
            }

            // (e) frontmatter name이 항목 이름과 같고 description이 있어야 한다.
            const lines = frontmatterLines(linkedSkill);
            if (!lines) {
              throw fail(name, 'SKILL.md에 frontmatter가 없습니다.');
            }
            const declaredName = topValue(lines, 'name');
            if (declaredName !== name) {
              throw fail(name, `frontmatter name 불일치(${declaredName || '없음'} ≠ ${name}).`);
            }
            if (!topValue(lines, 'description')) {
              throw fail(name, 'frontmatter description이 없습니다.');
            }
          };

          let entries;
          try {
            entries = fs.readdirSync(claudeSkillsDir);
          } catch (error) {
            console.error(`FAIL: .claude/skills 디렉터리를 읽을 수 없습니다(${error.code ?? error.message}).`);
            process.exit(1);
          }
          // 검사 대상이 0개면 디렉터리 유실을 통과시키지 않도록 실패로 처리한다.
          if (entries.length === 0) {
            console.error('FAIL: .claude/skills에 검사할 링크가 없습니다. 디렉터리가 비었거나 유실되었습니다.');
            process.exit(1);
          }

          try {
            for (const name of entries.sort()) {
              checkLink(name);
            }
          } catch (error) {
            if (!(error instanceof LinkError)) throw error;
            console.error(`FAIL: ${error.message}`);
            process.exit(1);
          }

          console.log(`검사한 링크 수: ${entries.length}`);
          console.log('이 검사는 링크 구조만 검증하며 Claude의 Native Skill 발견·호출 성공을 증명하지 않는다.');
          NODE

      - name: Regenerate instructions and check generated diffs
        run: |
          make instructions
          git diff --exit-code -- MINE.md
          git diff --exit-code -- AGENTS.md CLAUDE.md claude/CLAUDE.md skills/skill-index.json

      - name: Run the existing routing fixtures
        run: make test-routing-fixtures

      - name: Run existing report, result and preflight regressions
        run: |
          node scripts/test-f1-report-advisory.mjs
          make test-result-fixtures
          make test-truthfulness-fixtures
          make test-git-work-preflight-fixtures

      - name: Run dev-main-flow install fixtures
        run: make test-dev-main-flow-install-fixtures
        timeout-minutes: 2

      - name: Run offline usage summary fixtures
        run: |
          node scripts/test-role-usage-summary.mjs
          node scripts/test-usage-f1.mjs
        timeout-minutes: 2

      - name: Check whitespace in the pull request diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"
